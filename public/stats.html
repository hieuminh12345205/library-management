<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thống kê – LibraryHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>Thống kê</h1>
    <div id="alert" class="hidden"></div>
    <div id="summary" class="stat-grid"></div>
  </main>
  <script src="/js/common.js"></script>
  <script>
    const user = App.requireRole('LIBRARIAN', 'ADMIN');
    const alertBox = document.getElementById('alert');
    const S = App.STATUS_LABEL;

    function stat(label, value) {
      return `<div class="stat"><div class="value">${value}</div><div class="label">${label}</div></div>`;
    }

    async function loadSummary() {
      const { data } = await App.api('/stats/summary');
      const s = data.loansByStatus;
      document.getElementById('summary').innerHTML = [
        stat('Đầu sách', data.totalTitles),
        stat('Tổng số bản', data.totalCopies),
        stat('Bản còn trong kho', data.availableCopies),
        stat('Độc giả', data.totalReaders),
        stat(S.PENDING, s.PENDING),
        stat(S.BORROWING, s.BORROWING),
        stat(S.OVERDUE, s.OVERDUE),
        stat(S.RETURNED, s.RETURNED),
      ].join('');
    }

    if (user) {
      loadSummary().catch((err) => App.showAlert(alertBox, 'error', err.message));
    }
  </script>
</body>
</html>
