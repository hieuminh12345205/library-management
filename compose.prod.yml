# Cấu hình chạy trên VPS: DB không mở cổng ra ngoài, app chỉ nghe 127.0.0.1 (đi qua Nginx)
# Chạy: sudo docker compose --env-file .env.prod -f compose.prod.yml up -d --build
name: libraryhub
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: library
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://library:${POSTGRES_PASSWORD}@db:5432/library
      JWT_SECRET: ${JWT_SECRET:?}
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  pgdata:
